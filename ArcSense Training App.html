<!DOCTYPE html>
<html lang="en" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ArcSense Training App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: a phone-sized app on a quiet stage. Crimson is reserved for the primary action, the active state and the hero numbers. */
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --stage:#050506; --bg:#0a0a0c; --surface:#131316; --surface2:#1b1b20; --line:#2a2a31;
  --ink:#f5f3f0; --ink2:#a9a8b0; --ink3:#74737c;
  --brand:#990000; --brand-hi:#e2393f; --brand-soft:rgba(153,0,0,.24);
  --make:#35d489; --miss:#ff5d62; --amber:#f2b84b; --blue:#7aa7ff;
  --court:#0f0f12; --court-line:#40404a;
  color-scheme:dark;
}
html[data-mode="light"]{
  --stage:#e4e0dc; --bg:#f6f4f2; --surface:#ffffff; --surface2:#efebe8; --line:#dcd7d2;
  --ink:#151316; --ink2:#5d5a62; --ink3:#8b8790;
  --brand:#990000; --brand-hi:#a30f14; --brand-soft:rgba(153,0,0,.10);
  --make:#12915a; --miss:#d3343b; --amber:#a86a00; --blue:#2f5fd0;
  --court:#fbf9f7; --court-line:#bdb7b1;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--stage);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
svg{display:block}
a{color:inherit}
.num{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.01em;line-height:1}
.disp{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.03em;line-height:1}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
.small{font-size:12.5px} .tiny{font-size:11px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* stage + phone */
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:16px}
.side{display:none;width:270px;flex-direction:column;gap:14px;color:var(--ink2);font-size:13.5px}
.side h2{font:800 40px/.95 var(--display);text-transform:uppercase;color:var(--ink);letter-spacing:.02em}
.side .jump{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.side .jump button{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:13px}
.side .jump button:hover{border-color:var(--ink3)}
@media(min-width:1020px){.side{display:flex}}
.phone{position:relative;width:410px;max-width:100%;height:min(100%,900px);background:var(--bg);border-radius:38px;border:1px solid var(--line);box-shadow:0 40px 90px rgba(0,0,0,.55);overflow:hidden;display:flex;flex-direction:column}
@media(max-width:520px){.stage{padding:0}.phone{width:100%;height:100%;border-radius:0;border:0;box-shadow:none}}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 16px 28px;-webkit-overflow-scrolling:touch;animation:fade .25s ease}
@keyframes fade{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}

/* top bar + tabs */
.top{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;min-height:58px;position:relative;z-index:3}
.top h1{flex:1;font:800 24px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;min-width:0}
.logo{display:flex;align-items:center;gap:8px;flex:1}
.logo b{font:800 22px/1 var(--display);letter-spacing:.14em}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.demo-pill{font:700 9.5px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 55%,transparent);padding:5px 8px;border-radius:99px;white-space:nowrap}
.tabs{display:flex;gap:2px;border-top:1px solid var(--line);background:var(--surface);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:12px;color:var(--ink3);font-size:10.5px;font-weight:600;letter-spacing:.03em}
.tab.on{color:var(--brand-hi)}
.tab.on svg{filter:drop-shadow(0 0 6px var(--brand-soft))}
:focus-visible{outline:2px solid var(--brand-hi);outline-offset:2px;border-radius:8px}

/* cards + type */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.eyebrow{font:700 11px/1.2 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.h2{font:800 22px/1.05 var(--display);text-transform:uppercase;letter-spacing:.03em;text-wrap:balance}
.h3{font-weight:700;font-size:15px;text-wrap:balance}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}
.mt{margin-top:12px}.mt2{margin-top:20px}
.divider{height:1px;background:var(--line);margin:12px 0}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.tiles.t3{grid-template-columns:repeat(3,1fr)}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.tile .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.tile .num{font-size:30px;margin-top:6px}
.tile .s{font-size:12px;color:var(--ink2);margin-top:4px}
.up{color:var(--make)} .down{color:var(--miss)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:14px;font-weight:600;border:1px solid var(--line);background:var(--surface2);color:var(--ink);text-align:center}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;border-color:color-mix(in srgb,var(--miss) 60%,transparent);color:var(--miss)}
.btn.block{width:100%}
.btn.sm{height:34px;padding:0 12px;border-radius:10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.start{position:relative;width:100%;height:64px;border-radius:18px;background:linear-gradient(180deg,#b00000,var(--brand));color:#fff;border:1px solid #c01818;display:flex;align-items:center;justify-content:center;gap:12px;font:800 24px/1 var(--display);text-transform:uppercase;letter-spacing:.08em;box-shadow:0 10px 30px -8px rgba(153,0,0,.7);margin-top:14px}
.start::after{content:"";position:absolute;inset:-4px;border-radius:22px;border:2px solid var(--brand-hi);opacity:0;animation:pulse 2.6s ease-out infinite}
@keyframes pulse{0%{opacity:.6;transform:scale(.99)}70%,100%{opacity:0;transform:scale(1.04)}}
.link{color:var(--brand-hi);font-weight:600}

/* chips, seg, status */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.scrollx{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
.chip{height:32px;padding:0 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;height:32px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink2);text-align:center}
.seg button.on{background:var(--surface2);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.st{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.st.good{background:color-mix(in srgb,var(--make) 16%,transparent);color:var(--make)}
.st.warn{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)}
.st.bad{background:color-mix(in srgb,var(--miss) 16%,transparent);color:var(--miss)}
.st.neutral{background:var(--surface2);color:var(--ink2)}
.st.brand{background:var(--brand-soft);color:var(--brand-hi)}
.badge-prem{font-size:10px;font-weight:800;letter-spacing:.08em;padding:3px 7px;border-radius:6px;background:var(--brand-soft);color:var(--brand-hi);text-transform:uppercase}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.field label,.lbl{font-size:12px;color:var(--ink2);font-weight:600}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],select,textarea{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 14px;font:inherit;width:100%}
textarea{height:auto;min-height:84px;padding:12px;resize:vertical}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 20px) 20px,calc(100% - 15px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink2);margin-top:12px}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--brand)}
.switch{position:relative;width:46px;height:28px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);flex:none;transition:background .2s}
.switch i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink3);transition:transform .2s,background .2s}
.switch.on{background:var(--brand);border-color:var(--brand)}
.switch.on i{transform:translateX(18px);background:#fff}

/* lists */
.list>*{padding:12px 0;border-top:1px solid var(--line)}
.list>*:first-child{border-top:0;padding-top:2px}
.list>*:last-child{padding-bottom:2px}
.item{display:flex;align-items:center;gap:12px;width:100%}
.item .t{font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--brand-hi)}
.bar.thin{height:5px}
.avatar{border-radius:50%;flex:none}
.ring{position:relative;flex:none}
.ring-t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring-t b{font-size:30px}.ring-t span{font-size:10.5px;color:var(--ink2);letter-spacing:.08em;text-transform:uppercase;font-weight:700}

/* charts + court */
.court{width:100%;height:auto;display:block;border-radius:14px}
.zn{cursor:pointer}
.zl{font:800 19px var(--display);fill:var(--ink);paint-order:stroke;stroke:var(--court);stroke-width:3.5px;text-anchor:middle;pointer-events:none;letter-spacing:.02em}
.zs{font:600 11px var(--body);fill:var(--ink2);paint-order:stroke;stroke:var(--court);stroke-width:3px;text-anchor:middle;pointer-events:none}
.court.compact .zl{font-size:27px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.chartwrap{touch-action:pan-y;user-select:none}
.chartwrap svg{width:100%;height:auto;overflow:visible}
.chart-ro{font-size:12.5px;color:var(--ink2);min-height:20px;margin-bottom:6px}
.chart-ro b{color:var(--ink);font-weight:700}
.cgrid{stroke:var(--line);stroke-width:1}
.ctext{fill:var(--ink3);font:500 10px var(--body)}
.stackbar{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px}
.stackbar i{display:block;height:100%}

/* live session */
.cam{position:relative;border-radius:18px;overflow:hidden;background:#050507;border:1px solid var(--line);aspect-ratio:16/10}
.cam svg{position:absolute;inset:0;width:100%;height:100%}
.cam::after{content:"";position:absolute;left:0;right:0;height:30%;top:-30%;background:linear-gradient(180deg,transparent,rgba(226,57,63,.14),transparent);animation:scan 3.2s linear infinite;pointer-events:none}
@keyframes scan{to{top:100%}}
.rec{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.08em;color:#fff}
.rec i{width:8px;height:8px;border-radius:50%;background:var(--miss);animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25}}
.shotflash{font:800 34px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;min-width:90px;text-align:right}
.dotrow{display:flex;gap:5px;flex-wrap:wrap}
.dotrow i{width:11px;height:11px;border-radius:50%}

/* overlays */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.62);z-index:20;display:flex;align-items:flex-end;animation:fadeo .2s}
@keyframes fadeo{from{opacity:0}to{opacity:1}}
.sheet{background:var(--surface);border-radius:26px 26px 0 0;border:1px solid var(--line);border-bottom:0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-height:90%;overflow:auto}
.sheet .grab{width:42px;height:4px;border-radius:9px;background:var(--line);margin:-6px auto 14px}
.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;font-weight:600;z-index:40;max-width:88%;text-align:center;animation:fade .2s}

/* onboarding */
.ob{flex:1;min-height:0;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top)) 20px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.splash{background:radial-gradient(120% 70% at 50% 0%,rgba(153,0,0,.40),transparent 60%),var(--bg)}
.arcdraw{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 2.4s .3s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.ballanim{offset-path:path('M20 190 Q170 -70 320 190');offset-distance:0%;animation:fly 2.4s .3s ease forwards}
@keyframes fly{to{offset-distance:100%}}
.opt{display:block;width:100%;text-align:left;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.opt.on{border-color:var(--brand-hi);background:var(--brand-soft)}
.steps{display:flex;gap:6px;margin-bottom:18px}
.steps i{flex:1;height:4px;border-radius:9px;background:var(--surface2)}
.steps i.on{background:var(--brand-hi)}

/* tables */
.cmp{width:100%;border-collapse:collapse;font-size:13px}
.cmp th,.cmp td{padding:9px 6px;border-top:1px solid var(--line);text-align:center}
.cmp th:first-child,.cmp td:first-child{text-align:left;color:var(--ink2)}
.cmp thead th{border-top:0;font-weight:700}
.blur{filter:blur(5px);pointer-events:none;user-select:none;opacity:.7}
.lockwrap{position:relative}
.lockwrap .lockbtn{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:2}
.note{font-size:12px;color:var(--ink2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:flex-start}
.note.amber{border-color:color-mix(in srgb,var(--amber) 50%,transparent);color:var(--amber)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.arcdraw{stroke-dashoffset:0}.ballanim{offset-distance:100%}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
<clipPath id="cIn"><path d="M30 470 V328 A237.5 237.5 0 0 1 470 328 V470 Z"/></clipPath>
<clipPath id="cWL"><polygon points="-100,328 -100,-100 41,-100 213.8,328"/></clipPath>
<clipPath id="cWR"><polygon points="600,328 600,-100 459,-100 286.2,328"/></clipPath>
<clipPath id="cR"><circle cx="250" cy="417.5" r="318"/></clipPath>
<clipPath id="cT"><polygon points="41,-100 459,-100 250,417.5"/></clipPath>
</defs></svg>
<div class="stage">
  <aside class="side" id="side"></aside>
  <div class="phone" id="phone" role="application" aria-label="ArcSense app prototype"></div>
</div>
<script>
/* =====================================================================
   ArcSense prototype. Everything below the "simulated" markers is demo data.
   Architecture seam: DeviceAdapter / AnalysisEngine are the two interfaces
   real hardware + computer vision would replace.
   ===================================================================== */
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function gauss(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:0;
const sd=a=>{if(a.length<2)return 0;const m=avg(a);return Math.sqrt(avg(a.map(v=>(v-m)*(v-m))))};
const f1=v=>(Math.round(v*10)/10).toFixed(1);
const f0=v=>String(Math.round(v));
const P1=v=>f1(v)+'%';
const P0=v=>f0(v)+'%';

/* ---------- dates ---------- */
const DAY=864e5;
const D=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10));
const iso=ms=>new Date(ms).toISOString().slice(0,10);
const todayStr=()=>{const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')};
const fmtDate=(s,o)=>new Date(D(s)).toLocaleDateString('en-US',Object.assign({month:'short',day:'numeric',timeZone:'UTC'},o||{}));
const weekStart=s=>{const t=D(s);const dow=(new Date(t).getUTCDay()+6)%7;return iso(t-dow*DAY)};
const monthKey=s=>s.slice(0,7);
const daysAgo=n=>iso(D(todayStr())-n*DAY);
const END=iso(D(todayStr())-DAY);

/* ---------- court geometry (SVG units: 10 per foot, basket near bottom) ---------- */
const BX=250,BY=417.5;
const ZONES=[
 {id:'paint',name:'Paint',grp:'paint',target:58,lx:250,ly:364},
 {id:'midL',name:'Left Midrange',grp:'mid',target:40,lx:100,ly:338},
 {id:'midT',name:'Elbow / Top Mid',grp:'mid',target:42,lx:250,ly:225},
 {id:'midR',name:'Right Midrange',grp:'mid',target:40,lx:400,ly:338},
 {id:'c3L',name:'Left Corner 3',grp:'three',target:37,lx:15,ly:398},
 {id:'w3L',name:'Left Wing 3',grp:'three',target:34,lx:72,ly:218},
 {id:'t3',name:'Top of Key 3',grp:'three',target:34,lx:250,ly:150},
 {id:'w3R',name:'Right Wing 3',grp:'three',target:34,lx:428,ly:218},
 {id:'c3R',name:'Right Corner 3',grp:'three',target:37,lx:485,ly:398},
 {id:'ft',name:'Free Throw',grp:'ft',target:75,lx:250,ly:300}
];
const ZMAP=Object.fromEntries(ZONES.map(z=>[z.id,z]));
const GRPS={paint:{name:'Paint / layups',ids:['paint']},mid:{name:'Midrange',ids:['midL','midT','midR']},three:{name:'Three-point',ids:['c3L','w3L','t3','w3R','c3R']},ft:{name:'Free throws',ids:['ft']}};
const MISS=['short','long','left','right'];

function classify(x,y){
  const dx=x-BX,dy=BY-y;
  if(y>=328){if(Math.abs(dx)>=220)return dx<0?'c3L':'c3R'}
  else if(Math.hypot(dx,dy)>=237.5){const a=Math.atan2(dx,dy)*180/Math.PI;return Math.abs(a)<=22?'t3':(a<0?'w3L':'w3R')}
  if(x>=170&&x<=330)return y>=280?'paint':'midT';
  return x<170?'midL':'midR';
}
function sampleXY(z,r){
  for(let k=0;k<80;k++){
    let x,y;
    switch(z){
      case 'paint':x=250+gauss(r)*30;y=412-Math.abs(gauss(r))*42;break;
      case 'midL':x=45+r()*120;y=200+r()*250;break;
      case 'midR':x=335+r()*120;y=200+r()*250;break;
      case 'midT':x=175+r()*150;y=185+r()*92;break;
      case 'c3L':x=8+r()*16;y=336+r()*115;break;
      case 'c3R':x=476+r()*16;y=336+r()*115;break;
      case 'ft':return{x:+(250+gauss(r)*4).toFixed(1),y:+(280+gauss(r)*4).toFixed(1)};
      default:{const a=(z==='t3'?(r()*2-1)*20:(z==='w3L'?-1:1)*(26+r()*36))*Math.PI/180;const rr=243+Math.abs(gauss(r))*14;x=BX+rr*Math.sin(a);y=BY-rr*Math.cos(a)}
    }
    if(x<4||x>496||y<4||y>466)continue;
    if(classify(x,y)===z)return{x:+x.toFixed(1),y:+y.toFixed(1)};
  }
  return{x:250,y:z==='ft'?280:300};
}

function pickMiss(P,z,r){
  const w=(P.miss&&P.miss[z])||(P.miss&&P.miss.def)||[.3,.25,.225,.225];
  let u=r(),k=0;for(;k<3;k++){u-=w[k];if(u<=0)break}
  return MISS[k];
}
function pickZone(ST,r){
  const ids=Object.keys(ST.w);const tot=ids.reduce((s,k)=>s+ST.w[k],0);
  let u=r()*tot;for(const k of ids){u-=ST.w[k];if(u<=0)return k}
  return ids[0];
}
function genMetrics(P,t,r,type){
  const lerp=k=>P.form[k][0]+(P.form[k][1]-P.form[k][0])*t;
  const gs=type==='Game Speed';
  return{
    rel:+(lerp('rel')+gauss(r)*.9).toFixed(1),
    relSD:+Math.max(1.3,lerp('relSD')+gauss(r)*.35).toFixed(1),
    elbow:+Math.max(2.5,lerp('elbow')+gauss(r)*1.1+(gs?1.2:0)).toFixed(1),
    bal:Math.round(clamp(lerp('bal')+gauss(r)*3-(gs?4:0),40,98)),
    fol:Math.round(clamp(lerp('fol')+gauss(r)*2.5,40,99)),
    entry:+(lerp('entry')+gauss(r)*.7).toFixed(1),
    drift:+Math.max(2,lerp('drift')+gauss(r)*.8).toFixed(1)
  };
}
function genSession(P,idx,n,date,type,r){
  const t=n>1?idx/(n-1):1,ST=STYPES[type];
  const count=Math.round(ST.n[0]+r()*(ST.n[1]-ST.n[0]));
  const noise=gauss(r)*.025,shots=[];
  for(let i=0;i<count;i++){
    const z=pickZone(ST,r);
    const base=P.p[z]+(z==='ft'?P.gainFT:P.gain)*t+(z==='ft'?0:ST.pen)+noise;
    const m=r()<clamp(base,.08,.93)?1:0;
    const xy=sampleXY(z,r);
    shots.push({z,x:xy.x,y:xy.y,m,r:m?'':pickMiss(P,z,r),i});
  }
  return{id:P.id+'-'+idx,pid:P.id,date,type,minutes:Math.round(count*.5+8+r()*6),shots,metrics:genMetrics(P,t,r,type),sim:true};
}
const SEED={};
function genPlayer(P){
  if(SEED[P.id])return SEED[P.id];
  const r=rng(P.seed),n=P.n,span=P.span||84,offs=new Set([0]);
  while(offs.size<n)offs.add(Math.floor(r()*(span+1)));
  const days=[...offs].sort((a,b)=>b-a);
  const types=[['Mixed',.3],['Spot-up 3s',.2],['Form',.15],['Game Speed',.2],['Free Throws',.15]];
  return SEED[P.id]=days.map((off,idx)=>{
    let u=r(),type=types[0][0];for(const [t,w] of types){u-=w;if(u<=0){type=t;break}}
    return genSession(P,idx,n,iso(D(END)-off*DAY),type,r);
  });
}

function aggShots(sh){let m=0;for(const s of sh)m+=s.m;return{att:sh.length,made:m,pct:sh.length?m/sh.length*100:0}}
function byZone(sh){
  const o={};ZONES.forEach(z=>o[z.id]={att:0,made:0,pct:0,miss:{short:0,long:0,left:0,right:0}});
  for(const s of sh){const z=o[s.z];z.att++;z.made+=s.m;if(!s.m&&s.r)z.miss[s.r]++}
  for(const k in o)o[k].pct=o[k].att?o[k].made/o[k].att*100:0;
  return o;
}
function byGrp(Z){
  const o={};for(const g in GRPS){let a=0,m=0;GRPS[g].ids.forEach(id=>{a+=Z[id].att;m+=Z[id].made});o[g]={att:a,made:m,pct:a?m/a*100:0}}

}
function missTotals(sh){

const GMETA={overall:{name:'Overall shooting %',pct:true},three:{name:'Three-point %',pct:true},mid:{name:'Midrange %',pct:true},ft:{name:'Free-throw %',pct:true},shots7:{name:'Shots, last 7 days',pct:false},drills7:{name:'Drills, last 7 days',pct:false}};
function goalCurrent(metric){
  const d=pdata('me'),cut=daysAgo(30),rec=d.shots.filter(s=>s.date>=cut);
  const G=byGrp(byZone(rec));
  if(metric==='overall')return aggShots(rec).pct;
  if(metric==='three')return G.three.pct;if(metric==='mid')return G.mid.pct;if(metric==='ft')return G.ft.pct;
  if(metric==='shots7')return d.shots.filter(s=>s.date>=daysAgo(6)).length;
  if(metric==='drills7')return S.drillLog.filter(x=>x.date>=daysAgo(6)).length;
  return 0;
}
function achievements(){
  const d=pdata('me'),A=aggShots(d.shots),best=Math.max(...d.sessions.map(s=>aggShots(s.shots).pct));
  const ftBest=Math.max(0,...d.sessions.map(s=>{const f=s.shots.filter(x=>x.z==='ft');return f.length>=15?aggShots(f).pct:0}));
  return[
   {n:'First session',e:'Log your first session',ok:d.sessions.length>=1},
   {n:'100 shots',e:A.att+' tracked',ok:A.att>=100},
   {n:'1,000 shots',e:A.att+' of 1,000',ok:A.att>=1000},
   {n:'10 sessions',e:d.sessions.length+' of 10',ok:d.sessions.length>=10},
   {n:'50% session',e:'Hit 50% in one session',ok:best>=50},
   {n:'80% from the line',e:'80% FT in one session',ok:ftBest>=80},
   {n:'Form fixer',e:'Elbow flare under 10° in a session',ok:d.sessions.some(s=>s.metrics.elbow<10)},
   {n:'Drill starter',e:'Complete a drill',ok:S.drillLog.length>=1},
   {n:'Drill habit',e:'10 drills completed',ok:S.drillLog.length>=10}
  ];
}
function recommendations(pid){
  const d=pdata(pid),m=avgMetrics(d.sessions.slice(-5)),Z=byZone(d.shots),out=[];
  makeFindings(m,2).forEach(f=>out.push(Object.assign({tag:'Form'},f)));
  const zf=zoneFinding(Z);if(zf)out.push(Object.assign({tag:'Zone'},zf));
  const ft=ftFinding(Z);if(ft)out.push(Object.assign({tag:'Free throws'},ft));
  return out.slice(0,4);
}
function buildReport(sess,pid){
  const d=pdata(pid),idx=d.sessions.findIndex(s=>s.id===sess.id),prev=idx>0?d.sessions[idx-1]:null;
  const A=aggShots(sess.shots),Z=byZone(sess.shots),mb=missBreakdown(sess.shots);
  const findings=makeFindings(sess.metrics,2),zf=zoneFinding(Z,6);if(zf)findings.push(zf);
  const ft=ftFinding(Z);if(ft&&findings.length<3)findings.push(ft);
  const rows=FORM_DEFS.map(def=>({def,val:def.fmt(sess.metrics),st:metricStatus(def,sess.metrics),delta:prev?(sess.metrics[def.k]-prev.metrics[def.k]):null}));
  const pA=prev?aggShots(prev.shots):null;
  return{A,Z,mb,findings,rows,prev,dPct:pA?A.pct-pA.pct:null,form:formScore(sess.metrics)};
}

  if(a.pid==='me'){return S.drillLog.some(x=>x.d===a.drill&&x.date>=a.date)?'Completed':(a.due<=todayStr()?'Due':'Assigned')}

let CH_ID=0;const CHARTS={};
function lineChart(o){
  const id='c'+(++CH_ID),W=340,H=o.h||150,pl=32,pr=10,pt=10,pb=22;
  const all=o.series.flatMap(s=>s.vals.filter(v=>v!=null));

  else{const mn=Math.min(...all)-1,mx=Math.max(...all)+1,sp=mx-mn;tk=sp<=25?5:sp<=50?10:20;lo=Math.floor(mn/tk)*tk;hi=Math.ceil(mx/tk)*tk;if(hi-lo<tk*2)hi=lo+tk*2}
  const n=o.labels.length,X=i=>pl+(n>1?i*(W-pl-pr)/(n-1):(W-pl-pr)/2),Y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  let g='';

  const step=Math.max(1,Math.ceil(n/5));
  o.labels.forEach((l,i)=>{if(i===n-1||(i%step===0&&n-1-i>=step))g+=`<text class="ctext" x="${X(i)}" y="${H-5}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${esc(l)}</text>`});

    if(n<=16)pts.forEach(p=>{g+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="${col}"/>`});
    g+=`<circle id="mk-${id}-${si}" cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="5" fill="${col}" stroke="var(--surface)" stroke-width="2"/>`;
  });

    h+=`<circle cx="${s.x}" cy="${s.y}" r="${r}" fill="${s.m?'var(--make)':'var(--miss)'}" fill-opacity="${mode==='both'?.72:.9}" stroke="var(--court)" stroke-width=".8" pointer-events="none"/>`;
  }

    const st=Z[z.id];if(!st.att||z.id==='ft')return;

    if(!compact&&!cor)h+=`<text class="zs" x="${z.lx}" y="${z.ly+15}">${st.made}/${st.att}</text>`;
  });

    h+=`<g class="zn" data-act="${o.zoneAct||'zone'}" data-z="ft"><rect x="196" y="${compact?286:288}" width="108" height="${compact?32:28}" rx="14" style="fill:var(--surface2);stroke:${o.sel==='ft'?'var(--ink)':'var(--line)'};stroke-width:1.5"/><text x="250" y="${compact?308:307}" text-anchor="middle" style="font:800 ${compact?19:15}px var(--display);fill:var(--ink);letter-spacing:.03em">FT ${ar}${Math.round(Z.ft.pct)}%</text></g>`;
  }

function zoneDetail(shots,zid){

function drillDone30(id){return S.drillLog.filter(x=>x.d===id&&x.date>=daysAgo(30)).length}
function drillRow(dr,why){
  const n=drillDone30(dr.id);

}
function weekProgram(){
  const rec=recommendations('me').map(r=>r.drill),ids=[...new Set(rec.concat(['ft-routine','five-spot-3s','hop-step','shot-clock','form-ladder']))].slice(0,5),days=['Mon','Tue','Thu','Fri','Sat'];
  return ids.map((id,i)=>({day:days[i],drill:id,done:S.drillLog.some(x=>x.d===id&&x.date>=daysAgo(6))}));
}
function sTrain(){
  const recs=recommendations('me'),seen={},recD=[];
  recs.forEach(r=>{if(!seen[r.drill]){seen[r.drill]=1;recD.push({dr:DMAP[r.drill],why:r.tag+': '+r.title})}});

  if(asg.length)b+=`<div class="card"><div class="card-h"><span class="eyebrow">Assigned by your coach</span></div><div class="list">${asg.map(a=>`<button class="item" data-act="drill" data-id="${a.drill}"><div class="grow"><div class="t">${esc(DMAP[a.drill].name)}</div><div class="small muted">${esc(a.note)}</div><div class="tiny faint">Due ${fmtDate(a.due)} · ${esc(a.by)}</div></div>${stChip(assignStatus(a)==='Completed'?'good':assignStatus(a)==='Due'?'bad':'warn',assignStatus(a))}</button>`).join('')}</div></div>`;

function sProgress(){
  const d=pdata('me'),per=UI.prog.period,locked=per==='month'&&!isPrem();

  const lab=sl.map(x=>periodLabel(x.key,per));
  const totShots=sl.reduce((s,x)=>s+x.att,0),wo=sl.reduce((s,x)=>s+x.sessions.length,0);
  const best=Math.max(...d.sessions.map(s=>aggShots(s.shots).pct)),bestS=d.sessions.find(s=>aggShots(s.shots).pct===best);
  const mostMade=d.sessions.reduce((a,s)=>{const m=aggShots(s.shots).made;return m>a.m?{m,s}:a},{m:0,s:null});
  const stk=d.sessions.reduce((a,s)=>{const k=streakOf(s.shots);return k>a.k?{k,s}:a},{k:0,s:null});

  <div class="card"><div class="card-h"><span class="eyebrow">Shooting percentage</span><span class="tiny faint">Drag to read</span></div>${lineChart({labels:lab,series:[{name:'Overall',vals:sl.map(x=>+x.pct.toFixed(1))}],unit:'%',area:true,aria:'Shooting percentage over time'})}</div>
  <div class="card"><div class="card-h"><span class="eyebrow">Shots taken</span></div>${barChart({labels:lab,vals:sl.map(x=>x.att),aria:'Shots taken per period'})}</div>
  <div class="card"><div class="card-h"><span class="eyebrow">Consistency trend</span><span class="tiny faint">Release repeatability, 0–100</span></div>${lineChart({labels:lab,series:[{name:'Consistency',vals:sl.map(x=>consistency(x.relSD)),color:'var(--blue)'}],min:40,max:100,dec:0,aria:'Release consistency over time'})}</div>
  <div class="card"><div class="card-h"><span class="eyebrow">Workouts completed</span></div>${barChart({labels:lab,vals:sl.map(x=>x.sessions.length),aria:'Workouts per period'})}<div class="small muted mt">${S.drillLog.length} drills logged in total.</div></div>`;
  b+=`<div class="card"><div class="card-h"><span class="eyebrow">Personal records</span></div><div class="list">
   ${[['Best session',P1(best),bestS],['Most makes in a session',mostMade.m+' makes',mostMade.s],['Longest make streak',stk.k+' in a row',stk.s],t3?['Best 3-point session',P0(t3.a.pct)+' ('+t3.a.made+'/'+t3.a.att+')',t3.s]:null,ft?['Best free-throw session',P0(ft.a.pct)+' ('+ft.a.made+'/'+ft.a.att+')',ft.s]:null].filter(Boolean).map(r=>`<button class="item" data-act="report" data-sid="${r[2].id}" data-pid="me"><div class="grow"><div class="t">${r[0]}</div><div class="small muted">${fmtDate(r[2].date)}</div></div><b class="num" style="font-size:22px">${r[1]}</b></button>`).join('')}</div></div>
  <div class="card"><div class="card-h"><span class="eyebrow">Goals</span><button class="btn sm" data-act="open-goal">${ico('plus',14)} Add</button></div><div class="stack">${S.goals.map(gl=>{const m=GMETA[gl.metric],cur=goalCurrent(gl.metric),pc=clamp(cur/gl.target*100,0,100);
   return `<div class="row" style="gap:12px">${ring(pc,52,6,Math.round(pc),'')}<div class="grow"><div class="t">${m.name}</div><div class="small muted">${m.pct?P1(cur):Math.round(cur)} now · target ${gl.target}${m.pct?'%':''}</div></div><button class="iconbtn" data-act="del-goal" data-id="${gl.id}" aria-label="Remove goal">${ico('x',16)}</button></div>`}).join('')||'<div class="muted small">No goals yet.</div>'}</div></div>

function liveSchedule(){const L=UI.live;if(!L)return;clearInterval(L.timer);L.timer=setInterval(liveTick,L.speed===3?240:750)}
function liveTick(){

  L.inst.push({rel:f.rel[1]+gauss(r)*3.1,elbow:Math.max(2.5,f.elbow[1]+gauss(r)*2.4+(L.type==='Game Speed'?1.2:0)),bal:clamp(f.bal[1]+gauss(r)*5,40,98),fol:clamp(f.fol[1]+gauss(r)*4,40,99),entry:f.entry[1]+gauss(r)*1.6,drift:Math.max(2,f.drift[1]+gauss(r)*1.5)});

  pair(k,done){setTimeout(()=>{S.devices[k].st='on';save();done()},1500)},
  calibrate(k,tick,done){let i=0;const t=setInterval(()=>{i++;S.devices[k].step=i;if(i>=3){clearInterval(t);S.devices[k].cal='yes';S.devices[k].step=0;save();done()}else tick()},700)}

const FLOW={player:['signup','level','goals','hardware','first'],coach:['signup','goals','hardware','first']};
function obMove(dir){
  const fl=FLOW[UI.ob.role],i=fl.indexOf(S.stage),j=clamp(i+dir,0,fl.length-1);
  if(dir>0){
    if(S.stage==='level')S.acct.playerLevel=UI.ob.level;
    if(S.stage==='goals'){if(UI.ob.role==='coach')S.acct.team=UI.ob.team==null?S.acct.team:(UI.ob.team||S.acct.team);else if(UI.ob.goals.length)S.acct.goals=UI.ob.goals.slice()}
  }
  S.stage=fl[j];render();
}
function enterApp(role){
  stopTimers();S.role=role;S.stage='app';UI.tab='home';UI.coach.tab='roster';UI.stack=[];UI.dialog=null;save();render();
}
function jump(v){
  stopTimers();UI.dialog=null;
  if(v==='splash'){S.stage='splash';UI.stack=[];render();return}
  S.stage='app';
  if(v==='coach'){S.role='coach';UI.coach.tab='roster';UI.stack=[];render();return}
  S.role='player';UI.stack=[];
  if(v==='player-home')UI.tab='home';
  else if(v==='chart')UI.tab='chart';
  else if(v==='report'){UI.tab='home';const ss=pdata('me').sessions;UI.stack=[{n:'report',p:{sid:ss[ss.length-1].id,pid:'me'}}]}
  else if(v==='live'){UI.tab='home';UI.setup={type:'Mixed',count:20};UI.dialog={type:'setup',data:{}}}
  else if(v==='devices'||v==='plans'){UI.tab='more';UI.stack=[{n:v,p:{}}]}
  render();
}

  S=defaults();invalidate();UI.stack=[];UI.tab='home';UI.dialog=null;UI.drill=null;UI.chart={session:'all',range:'all',type:'all',view:'both',zone:null};

const GDEF={overall:50,three:35,mid:42,ft:80,shots7:150,drills7:5};

function act(el,e){
  const parts=el.dataset.act.split(':'),a=parts[0],arg=parts[1],v=el.dataset.v;
  switch(a){
    /* onboarding */
    case'ob-start':S.stage='signup';render();break;
    case'ob-signin':S.stage='signin';render();break;
    case'ob-splash':S.stage='splash';render();break;
    case'demo-role':enterApp(v);break;
    case'ob-signin-go':enterApp(v);break;
    case'ob-role':UI.ob.role=v;render();break;
    case'ob-signup-go':{
      const o=UI.ob,nm=(o.name||'').trim();
      if(!nm){toast('Enter your name to continue');return}
      if(o.age==='u13'&&!o.guardian){toast('A parent or guardian must agree for players under 13');return}
      if(!o.terms){toast('Please accept the terms to continue');return}
      S.role=o.role;S.acct.email=o.email;S.acct.age=o.age;S.acct.guardian=!!o.guardian;
      if(o.role==='coach')S.acct.coachName=nm;else S.acct.playerName=nm;
      S.stage=FLOW[o.role][1];render();break}
    case'ob-next':obMove(1);break;
    case'ob-prev':obMove(-1);break;
    case'ob-level':UI.ob.level=v;render();break;
    case'ob-goal':{const g=UI.ob.goals,i=g.indexOf(v);if(i>=0)g.splice(i,1);else g.push(v);render();break}
    case'ob-pair':['cam','hoop'].forEach(k=>{S.devices[k].st='on';S.devices[k].cal='yes'});save();toast('Demo devices paired and calibrated');break;
    case'ob-finish':{
      S.acct.goals=UI.ob.goals.length?UI.ob.goals.slice():S.acct.goals;
      enterApp(S.role);
      if(v==='train'){UI.setup={type:'Mixed',count:20};openDialog('setup')}
      break}
    /* navigation */
    case'tab':setTab(v);break;
    case'back':if(UI.stack[UI.stack.length-1]&&UI.stack[UI.stack.length-1].n==='drill'&&UI.drill&&UI.drill.timer){clearInterval(UI.drill.timer);UI.drill.running=false}back();break;
    case'go':go(el.dataset.n);break;
    case'report':go('report',{sid:el.dataset.sid,pid:el.dataset.pid||'me'});break;
    case'coach-player':go('coachPlayer',{pid:el.dataset.pid});break;
    case'switch-role':stopTimers();S.role=S.role==='coach'?'player':'coach';UI.stack=[];UI.tab='home';UI.coach.tab='roster';save();render();break;
    case'signout':stopTimers();S.stage='splash';UI.stack=[];save();render();break;
    case'jump':jump(v);break;
    case'noop':break;
    /* chart + filters */
    case'zone':UI.chart.zone=UI.chart.zone===el.dataset.z?null:el.dataset.z;render();break;
    case'home-zone':UI.homeZone=UI.homeZone===el.dataset.z?null:el.dataset.z;render();break;
    case'c-type':UI.chart.type=v;UI.chart.zone=null;render();break;
    case'c-view':UI.chart.view=v;render();break;
    case't-cat':UI.train.cat=v;render();break;
    case'p-per':UI.prog.period=v;render();break;
    /* drills */
    case'drill':{
      const id=el.dataset.id;
      if(UI.drill&&UI.drill.id!==id){if(UI.drill.timer)clearInterval(UI.drill.timer);UI.drill=null}
      go('drill',{id});break}
    case'rep':{const u=UI.drill;if(!u)break;u.reps=Math.max(0,u.reps+(+v));setHTML('dr-reps',String(u.reps));setHTML('dr-bar',bar(u.reps/DMAP[u.id].reps*100));break}
    case'dr-timer':{
      const u=UI.drill;if(!u)break;
      if(u.running){clearInterval(u.timer);u.running=false}
      else{u.running=true;u.timer=setInterval(()=>{u.secs++;setHTML('dr-time',fmtClock(u.secs))},1000)}
      setHTML('dr-timer',u.running?'Pause timer':'Start timer');break}
    case'dr-done':{
      const u=UI.drill;if(!u)break;if(u.timer)clearInterval(u.timer);
      S.drillLog.push({d:u.id,date:todayStr(),reps:u.reps||DMAP[u.id].reps});save();UI.drill=null;
      back();toast('Drill logged. Nice work.');break}
    /* sessions */
    case'open-setup':UI.setup={type:'Mixed',count:40};openDialog('setup');break;
    case'setup-type':UI.setup.type=v;render();break;
    case'setup-len':UI.setup.count=+v;render();break;
    case'live-begin':startLive();break;
    case'live-end':finishLive();break;
    case'live-pause':{const L=UI.live;if(!L)break;L.paused=!L.paused;setHTML('lv-pause',L.paused?ico('play',16)+' Resume':ico('pause',16)+' Pause');break}
    case'live-speed':{const L=UI.live;if(!L)break;L.speed=L.speed===1?3:1;setHTML('lv-speed',L.speed+'× speed');liveSchedule();break}
    case'share':{const sid=arg;if(!S.privacy.shareReports){toast('Report sharing is off in Privacy settings');break}S.shared[sid]=!S.shared[sid];save();render();toast(S.shared[sid]?'Shared with your coach (demo)':'Sharing turned off');break}
    /* dialogs, goals */
    case'dlg-close':closeDialog();break;
    case'dlg-bg':if(e.target===el)closeDialog();break;
    case'open-goal':openDialog('goal');break;
    case'goal-add':{const m=$('#g-metric').value,t=+$('#g-target').value;if(!(t>0)){toast('Enter a target above zero');break}S.goals.push({id:'g'+Date.now(),metric:m,target:t});save();closeDialog();toast('Goal added');break}
    case'del-goal':S.goals=S.goals.filter(g=>g.id!==el.dataset.id);save();render();break;
    case'open-delete':openDialog('delete');break;
    case'delete-go':resetAll();render();toast('Account and data deleted');break;
    case'reset-demo':S.userSessions=[];S.drillLog=seedDrills();S.assigned=seedAssigned();S.notes={};S.reviewed={};S.shared={};invalidate();save();render();toast('Demo data reset');break;
    case'copy-data':{
      const txt=dataSummary();
      try{navigator.clipboard.writeText(txt).then(()=>toast('Summary copied'),()=>toast('Copy was blocked by the browser'))}catch(err){toast('Copy was blocked by the browser')}
      break}
    /* settings */
    case'plan':S.plan=v;save();render();toast(v==='premium'?'Premium preview on (no payment taken)':'Switched to Basic (demo)');break;
    case'set-mode':S.mode=S.mode==='dark'?'light':'dark';save();render();break;
    case'set-notif':S.notif[arg]=!S.notif[arg];save();render();break;
    case'set-priv':S.privacy[arg]=!S.privacy[arg];save();render();break;
    /* devices */
    case'dev-conn':S.devices[arg].conn=v;save();render();break;
    case'dev-pair':{const k=v;S.devices[k].st='pairing';render();SimulatedDevice.pair(k,render);break}
    case'dev-unpair':{const k=v,d=S.devices[k];d.st='off';d.cal='no';d.step=0;if(S.devices.rec)S.devices.rec=false;save();render();break}
    case'dev-cal':{const k=v,d=S.devices[k];d.cal='running';d.step=0;render();SimulatedDevice.calibrate(k,render,render);break}
    case'dev-rec':{const dv=S.devices;dv.rec=!dv.rec;if(dv.rec)dv.recStart=Date.now();save();render();toast(dv.rec?'Simulated recording started':'Simulated recording stopped');break}
    case'dev-quick':['cam','hoop'].forEach(k=>{S.devices[k].st='on';S.devices[k].cal='yes'});save();render();toast('Both devices ready (demo)');break;
    /* coach */
    case'cmp-toggle':{const c=UI.coach.cmp,i=c.indexOf(v);if(i>=0){if(c.length>1)c.splice(i,1)}else{c.push(v);if(c.length>3)c.shift()}render();break}
    case'asg-toggle':{const c=UI.coach.asgPlayers,i=c.indexOf(v);if(i>=0)c.splice(i,1);else c.push(v);render();break}
    case'asg-go':{
      const c=UI.coach;if(!c.asgPlayers.length)break;
      c.asgPlayers.forEach((pid,i)=>S.assigned.push({id:'a'+Date.now()+i,drill:c.asgDrill,pid,due:c.asgDue,note:c.asgNote||'Focus on clean reps.',by:S.acct.coachName,date:todayStr()}));
      const n=c.asgPlayers.length;c.asgNote='';save();render();toast('Assigned to '+n+' player'+(n===1?'':'s'));break}
    case'coach-assign':UI.coach.asgPlayers=[el.dataset.pid];UI.coach.asgDrill=el.dataset.drill;UI.coach.asgNote='';setTab('assign');break;
    case'save-note':{const t=$('#coach-note');S.notes[el.dataset.sid]=t?t.value:'';S.reviewed[el.dataset.sid]=true;save();render();toast('Note saved. Report marked reviewed.');break}
  }
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||!$('#phone').contains(el))return;
  if(el.dataset.act==='dlg-bg'&&e.target!==el)return;
  act(el,e);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.ob&&t.type!=='checkbox'&&t.tagName!=='SELECT')UI.ob[t.dataset.ob]=t.value;
  else if(t.dataset.model)UI.coach[t.dataset.model]=t.value;
  else if(t.dataset.set){S.acct[t.dataset.set]=t.value;save()}
  else if(t.id==='del-in'){const b=$('#del-btn');if(b)b.disabled=t.value.trim()!=='DELETE'}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.ob){UI.ob[t.dataset.ob]=t.type==='checkbox'?t.checked:t.value;if(t.dataset.ob==='age'||t.dataset.ob==='guardian'){if(t.dataset.ob==='age'&&t.value!=='u13')UI.ob.guardian=false;render()}}
  else if(t.dataset.sel){
    const k=t.dataset.sel;
    if(k==='session'){UI.chart.session=t.value;if(t.value!=='all')UI.chart.range='all';UI.chart.zone=null}
    else if(k==='range'){UI.chart.range=t.value;UI.chart.zone=null}
    else if(k==='asgDrill')UI.coach.asgDrill=t.value;
    render();
  }
  else if(t.dataset.set){S.acct[t.dataset.set]=t.value;save();if(t.dataset.set==='playerLevel'||t.dataset.set==='team'||t.dataset.set==='playerName'||t.dataset.set==='coachName'){/* no re-render needed */}}
  else if(t.id==='g-metric'){const g=$('#g-target');if(g)g.value=GDEF[t.value]||50}
});
/* chart scrubbing */
function scrub(e){
  const t=e.target.closest&&e.target.closest('.chartwrap');if(!t)return;
  const el=document.elementFromPoint(e.clientX,e.clientY);
  if(el&&el.classList&&el.classList.contains('hit'))setChartPoint(el.dataset.chart,+el.dataset.i);
}
document.addEventListener('pointermove',scrub);
document.addEventListener('pointerdown',scrub);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.dialog)closeDialog()});

/* ---------- boot ---------- */
if(S.stage==='app'&&S.role!=='coach')S.role='player';
render();renderSide();
</script>
</body>
</html>
